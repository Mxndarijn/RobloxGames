#
# Required check name for the ruleset: exactly "pr-gate" (job name).
# Apply the ruleset only after this workflow has been green once on a PR.
# pr-gate only collects the game jobs' results; the tools/pr-gate checks (layout, budget,
# runtime budget) run in parallel as steal-a-slime-gate when steal-a-slime or its shared deps
# changed (skipped jobs still leave pr-gate green, so the required check always reports);
# when it is green, automerge turns on squash auto-merge for the PR.
name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      slime: ${{ steps.f.outputs.slime }}
      escape: ${{ steps.f.outputs.escape }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: f
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            slime:
              - 'games/steal-a-slime/**'
              - 'shared/modeling-kit/out/**'
              - 'shared/modeling-kit/models/slime_fountain.py'
              - 'tools/pr-gate/**'
              - '.github/workflows/**'
            escape:
              - 'games/speed-escape/**'
              - '.github/workflows/**'

  steal-a-slime:
    name: steal-a-slime (rojo, lune, lint, place, types)
    needs: changes
    if: needs.changes.outputs.slime == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/steal-a-slime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          path: games/steal-a-slime
          cache: "true"
          token: ${{ github.token }}
      - name: Install toolchain
        run: rokit install --no-trust-check
      - name: Wally install
        run: wally install
      - name: Rojo build
        run: rojo build -o build.rbxlx
      - name: Lune tests
        run: lune run tests
      - name: Cloud-test staging (stage-specs must accept TestRunner)
        run: lune run tools/pipeline/stage-specs "$RUNNER_TEMP/CloudTests"
      - name: Selene
        run: selene src tests
      - name: StyLua
        run: stylua --check src tests
      - name: Place safety
        run: lune run scripts/check-place.luau build.rbxlx
      - name: Typecheck (server + shared fatal)
        run: scripts/typecheck.sh

  # The whole Lune suite with every Config.FEATURES flag forced on / off (scripts/test-flags.luau;
  # tests that cannot run in a forced mode are listed with a reason in tests/ForcedFlags.luau).
  steal-a-slime-flags:
    name: steal-a-slime (lune, all flags ${{ matrix.mode }})
    needs: changes
    if: needs.changes.outputs.slime == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [on, off]
    defaults:
      run:
        working-directory: games/steal-a-slime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          path: games/steal-a-slime
          cache: "true"
          token: ${{ github.token }}
      - name: Install toolchain
        run: rokit install --no-trust-check
      - name: Wally install
        run: wally install
      - name: Lune tests, every FEATURES flag ${{ matrix.mode }}
        run: lune run scripts/test-flags ${{ matrix.mode }}

  speed-escape:
    name: speed-escape (rojo, lune, lint)
    needs: changes
    if: needs.changes.outputs.escape == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/speed-escape
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          path: games/speed-escape
          cache: "true"
          token: ${{ github.token }}
      - name: Install toolchain
        run: rokit install --no-trust-check
      - name: Wally install
        run: wally install
      - name: Rojo build
        run: rojo build -o build.rbxlx
      - name: Lune tests
        run: lune run tests
      - name: Selene
        run: selene src tests
      - name: StyLua
        run: stylua --check src tests

  # Soft / future: rhr is NOT a required gate yet.
  # Reasons (2026-10-15): SlimeUI is code-built with no *.story.luau, so
  # `rhr check` on the place finds no ScreenGui ("not checked", not "pass").
  # Also rhr 1.0.0rc1 needs Python 3.12 + skia + EGL, which the box has via a
  # custom venv (/home/box/.local/share/rhr-venv) but GHA does not. Add a job
  # here only after (1) Jolt lands stories and (2) a GHA install path is proven.
  # Until then: every-commit rhr stays on the box (see /guides/roblox-automated-tests.md).

  # tools/pr-gate checks that the other game jobs don't already cover: layout, budget and the
  # runtime budget. `logic` (lune run tests) and `typecheck` are left out: the steal-a-slime job
  # above runs both, and running the Lune suite here again cost ~3 min on every PR.
  # Runs in parallel with the other game jobs; pr-gate below only collects the results.
  steal-a-slime-gate:
    name: steal-a-slime (layout, budget, runtime budget)
    needs: changes
    if: needs.changes.outputs.slime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Rokit
        uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        with:
          path: games/steal-a-slime
          cache: "true"
          token: ${{ github.token }}
      - name: Install toolchain
        working-directory: games/steal-a-slime
        run: rokit install --no-trust-check
      # Optional: without rhr the layout check's render step skips with a notice
      # and the Lune LayoutAssert part still gates (tools/pr-gate/README.md).
      - name: Setup Python for rhr
        continue-on-error: true
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install rhr 1.0.0rc1 (optional)
        continue-on-error: true
        timeout-minutes: 2
        run: |
          sudo apt-get install -y -qq --no-install-recommends libegl1 libgles2 libgl1 >/dev/null
          pip install -q 'roblox-headless-renderer==1.0.0rc1'
          rhr --version
      - name: PR gate (layout, budget)
        run: tools/pr-gate/run.sh layout budget
      # Runtime parts / unique meshes / MeshParts counted like the Studio perf step (perf_server.luau on the
      # booted fake runtime), limits from tools/pipeline/pc-watcher/budgets.json. Warnings are annotations.
      - name: Wally install (runtime budget)
        working-directory: games/steal-a-slime
        run: wally install
      - name: Runtime budget (parts, unique meshes, MeshParts)
        run: tools/pr-gate/runtime_budget.sh

  pr-gate:
    name: pr-gate
    if: always()
    needs: [changes, steal-a-slime, steal-a-slime-flags, steal-a-slime-gate, speed-escape]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require game jobs that ran
        run: |
          changes="${{ needs.changes.result }}"
          slime="${{ needs.steal-a-slime.result }}"
          flags="${{ needs.steal-a-slime-flags.result }}"
          gate="${{ needs.steal-a-slime-gate.result }}"
          escape="${{ needs.speed-escape.result }}"
          echo "changes=$changes steal-a-slime=$slime steal-a-slime-flags=$flags steal-a-slime-gate=$gate speed-escape=$escape"
          # changes must succeed; skipped game jobs = paths filter said no; anything else fails
          ok_game() { [ "$1" = "success" ] || [ "$1" = "skipped" ]; }
          if [ "$changes" = "success" ] && ok_game "$slime" && ok_game "$flags" && ok_game "$gate" && ok_game "$escape"; then
            echo "game jobs OK"
            exit 0
          fi
          echo "pr-gate FAIL"
          exit 1

  # Squash auto-merge once pr-gate is green. Same-repo, non-draft PRs only (a
  # fork's token can't merge). Needs "Allow auto-merge" in the repo settings;
  # GitHub then merges when every required check passes.
  automerge:
    name: automerge
    needs: pr-gate
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --squash --auto "$PR_URL"
